version: "0.5"
model:
  id: qccg-rfqg-bridge
  title: "QCCG × RFQG continuum-bridge audit"
  choices:
    scope: "finite-Weyl quadratic flat-sector pilot; not a full QCCG many-body solution"
    local_register: "finite K-state Weyl qudit"
    reciprocity: "2-cell / dual-2-cell geometric reciprocity"
    quadratic_background: "periodic flat lattice Hessian"
    continuum_target: "Lorentzian asymptotic-safety / RFQG-5 universality class"

obligations:
  - id: FINITE_WEYL_ALGEBRA
    title: "Finite local Weyl algebra is realized"
    kind: formal-numerical
    description: "A finite K-state register realizes ZX=omega XZ and bounded local Weyl operators."
  - id: WEYL_QUADRATIC_LIMIT
    title: "Finite Weyl plaquette term has a controlled quadratic small-phase limit"
    kind: numerical
    description: "For preregistered finite K values, 2-W-W† approaches Q^2 at the declared tolerance."
  - id: GEOMETRIC_RECIPROCITY
    title: "Geometric reciprocity is declared"
    kind: physical-choice
    description: "Curvature 2-cells and conjugate dual flux use the same elementary register type."
  - id: D4_RECIPROCITY_ALGEBRA
    title: "The reciprocity dimension relation selects D=4"
    kind: formal
    description: "Given geometric reciprocity, 2=D-2 has the unique integer solution D=4."
  - id: TT_QUADRATIC_SPECTRUM
    title: "Declared quadratic Hessian has exactly two massless tensor branches"
    kind: numerical
    description: "The flat-sector quadratic Hessian has two zero branches and no zero defect branch at finite periodic volume."
  - id: FINITE_SIZE_GAP_SCALING
    title: "First tensor excitation scales as 1/L"
    kind: robustness
    description: "The first nonzero tensor frequency obeys preregistered z=1 finite-size scaling over the declared lattice sizes."
  - id: DEFECT_GAP_STABILITY
    title: "Declared scalar/vector defect sectors remain gapped"
    kind: robustness
    description: "The model-internal defect mass remains nonzero under the same finite-size scan."
  - id: FULL_MICROSCOPIC_DERIVATION
    title: "The quadratic tensor Hessian is derived from one fully explicit interacting finite-qudit parent Hamiltonian"
    kind: physics
    description: "Requires a fixed microscopic Hamiltonian and controlled derivation, not coefficient tuning of the Hessian."
  - id: CELLULATION_LIQUID_ZERO_MODE
    title: "The local-move Hamiltonian admits a unique uniform cellulation-liquid zero mode"
    kind: formal-numerical
    description: "On a connected audited cellulation-move graph, H_move is a positive graph Laplacian with unique uniform zero state."
  - id: CELLULATION_CONNECTIVITY_CONTROL
    title: "Disconnected move graphs are detected as degenerate-vacuum failures"
    kind: negative-control
    description: "A disconnected cellulation-move graph must produce multiple zero modes."
  - id: MANIFOLD_LIKENESS_SCALING
    title: "The cellulation liquid has a smooth 3+1 Lorentzian manifold-like scaling phase"
    kind: physics
    description: "Requires scaling evidence for dimension, signature, locality and manifold-likeness."
  - id: CONTINUUM_MANIFOLD_PHASE
    title: "The critical phase reconstructs a smooth 3+1 Lorentzian continuum"
    kind: physics
    description: "Requires manifold-likeness, signature and continuum reconstruction beyond the finite cellulation-liquid pilot."
    depends_on:
      - CELLULATION_LIQUID_ZERO_MODE
      - CELLULATION_CONNECTIVITY_CONTROL
      - MANIFOLD_LIKENESS_SCALING
  - id: COMMON_CAUSAL_PROPAGATOR
    title: "A common microscopic causal propagation coefficient is declared"
    kind: physical-choice
    description: "Tensor and probe-matter sectors use one bare propagation coefficient; this is a model principle rather than an RG result."
  - id: BARE_SPATIAL_ISOTROPY
    title: "The selected quadratic parent has a common isotropic bare cone"
    kind: numerical
    description: "Cubic-symmetric spatial links and the shared propagation coefficient give the audited species one bare z=1 cone."
  - id: LATTICE_LV_IRRELEVANT
    title: "Higher-derivative lattice Lorentz violation is irrelevant"
    kind: rg-analytic
    description: "Four-derivative lattice corrections scale away relative to the two-derivative kinetic term."
  - id: MARGINAL_LV_STABILITY
    title: "The common cone is stable against marginal/relevant Lorentz-violating deformations"
    kind: physics
    description: "Requires an interacting RG or symmetry argument; canonical scaling alone leaves velocity anisotropies marginal."
  - id: LORENTZ_UNIVERSALITY
    title: "All physical sectors share an emergent z=1 light cone"
    kind: physics
    description: "Requires exclusion of relevant/marginal Lorentz-violating operators and equality of matter/gravity characteristics."
    depends_on:
      - id: COMMON_CAUSAL_PROPAGATOR
        accept: [PASS, MODEL_CHOICE]
      - BARE_SPATIAL_ISOTROPY
      - LATTICE_LV_IRRELEVANT
      - MARGINAL_LV_STABILITY
  - id: LINEARIZED_CONSTRAINT_ALGEBRA
    title: "The linearized symmetric-tensor target has four first-class constraints"
    kind: formal-numerical
    description: "Hamiltonian plus momentum constraints have rank four and close at the linearized continuum target."
  - id: TT_PROJECTOR_RANK2
    title: "The linearized symmetric-tensor target has a rank-two TT physical projector"
    kind: formal-numerical
    description: "The continuum target TT projector is transverse, traceless, idempotent and rank two."
  - id: HDA_NONABELIAN_TARGET
    title: "The nonlinear GR hypersurface-deformation target is generically non-Abelian"
    kind: formal
    description: "Generic Hamiltonian-constraint smearings close into a diffeomorphism generator with metric-dependent structure functions."
  - id: COMMUTING_PROJECTOR_HDA_REJECTED
    title: "A mutually commuting nonlinear Hamiltonian-projector completion is rejected"
    kind: negative-control
    description: "A zero Hamiltonian-constraint commutator cannot reproduce the generic GR hypersurface-deformation target."
  - id: STRUCTURE_FUNCTION_CLOSURE_TOY
    title: "A finite-dimensional noncommuting constraint toy closes with an operator-valued structure function"
    kind: formal-numerical
    description: "A scoped finite Hilbert-space example demonstrates exact noncommuting closure, Jacobi identity and a nontrivial common kernel."
  - id: CONSTRAINT_KERNEL_GAP_TOY
    title: "The structure-function toy has a gapped constraint-penalty Hamiltonian preserving the physical kernel"
    kind: formal-numerical
    description: "The toy constraint penalty is positive, gapped above the common kernel and commutes with the toy constraints."
  - id: STRUCTURE_FUNCTION_NEGATIVE_CONTROL
    title: "An incorrect constant structure function is detected as a closure failure"
    kind: negative-control
    description: "Replacing the sector-dependent operator structure function by a constant fails the exact closure relation."
  - id: GR_HDA_STRUCTURE_FUNCTION_MATCH
    title: "The finite-Weyl nonlinear constraints reproduce the dynamical GR HDA structure functions"
    kind: physics
    description: "Requires inverse-metric/operator-valued structure functions with the correct smearing dependence, not merely a central toy operator."
  - id: NONLINEAR_CONSTRAINT_CLOSURE
    title: "The nonlinear interacting constraint/BRST algebra closes anomaly-free"
    kind: physics
    description: "Requires noncommuting constraint generators with the correct operator/field-dependent structure functions and physical-kernel preservation."
    depends_on:
      - HDA_NONABELIAN_TARGET
      - COMMUTING_PROJECTOR_HDA_REJECTED
      - STRUCTURE_FUNCTION_CLOSURE_TOY
      - CONSTRAINT_KERNEL_GAP_TOY
      - STRUCTURE_FUNCTION_NEGATIVE_CONTROL
      - GR_HDA_STRUCTURE_FUNCTION_MATCH
  - id: CONTINUUM_DIFFEO_BRST
    title: "Continuum diffeomorphism/BRST identities emerge"
    kind: physics
    description: "Requires continuum mSTI/mNI or equivalent gauge identities; graph relabeling alone is insufficient."
    depends_on:
      - LINEARIZED_CONSTRAINT_ALGEBRA
      - TT_PROJECTOR_RANK2
      - NONLINEAR_CONSTRAINT_CLOSURE
  - id: FINITE_PARENT_UNITARITY
    title: "The finite audited parent Hamiltonian generates unitary evolution"
    kind: formal-numerical
    description: "Finite Weyl generators are unitary and local parent terms are Hermitian on every finite audited lattice."
  - id: QUADRATIC_SCALING_ISOMETRY
    title: "The free band-limited quadratic sector has an isometric continuum scaling map"
    kind: numerical
    description: "Fixed low Fourier modes preserve norm and converge to continuum wave evolution as the lattice is refined."
  - id: INTERACTING_PHYSICAL_SCALING_UNITARITY
    title: "The interacting graph-changing physical Hilbert space has a controlled unitary scaling limit"
    kind: physics
    description: "Requires an isometric continuum map for the constrained interacting physical state space."
  - id: PHYSICAL_UNITARITY_SCALING_LIMIT
    title: "Microscopic unitarity descends isometrically to the continuum physical Hilbert space"
    kind: physics
    description: "Requires a controlled scaling map and physical spectral/unitarity checks."
    depends_on:
      - FINITE_PARENT_UNITARITY
      - QUADRATIC_SCALING_ISOMETRY
      - INTERACTING_PHYSICAL_SCALING_UNITARITY
  - id: CUBIC_VERTEX_OBSTRUCTION_DETECTED
    title: "The cosine-only parent lacks a cubic collective vertex around the flat vacuum"
    kind: negative-control
    description: "The original even cosine parent has vanishing third derivative at the vacuum."
  - id: GENERIC_CUBIC_INTERACTION_REPAIR
    title: "A finite-Weyl three-body term adds cubic nonlinearity without changing the quadratic Hessian"
    kind: formal-numerical
    description: "The repair is Hermitian, stationary at the flat vacuum, has zero quadratic correction and nonzero cubic derivative in the audited weak-coupling regime."
  - id: CUBIC_VACUUM_STABILITY_CONTROL
    title: "The cubic repair's strong-coupling vacuum instability is detected"
    kind: negative-control
    description: "A stronger coupling must be able to shift the discrete vacuum, demonstrating a genuine stability bound."
  - id: NONDERIVATIVE_CUBIC_MISMATCH_DETECTED
    title: "A non-derivative local cubic is rejected as insufficient for the GR-like three-graviton structure"
    kind: negative-control
    description: "The earlier local cubic acts on a uniform collective mode and lacks the required two-derivative structure."
  - id: DERIVATIVE_CUBIC_REPAIR
    title: "A link-based finite-Weyl cubic yields a field-times-two-derivatives continuum structure"
    kind: formal-numerical
    description: "The repair has zero linear/quadratic variation, nonzero cubic variation and vanishes on spatially uniform modes."
  - id: GR_CUBIC_VERTEX_MATCH
    title: "The microscopic cubic interaction matches the physical GR three-graviton Ward identities"
    kind: physics
    description: "Requires full tensor-index nonlinear diffeomorphism/soft-graviton consistency, not merely a derivative cubic scalar proxy."
    depends_on:
      - NONDERIVATIVE_CUBIC_MISMATCH_DETECTED
      - DERIVATIVE_CUBIC_REPAIR
  - id: RG_BRIDGE_OBSERVABLES_EXTRACTED
    title: "QCCG bridge observables are extracted for continuum universality comparison"
    kind: rg-analytic
    description: "The audited parent supplies pole normalization, leading irrelevant lattice exponent and nonlinear cubic data."
  - id: IR_TWO_POINT_MATCH_INSUFFICIENT
    title: "Two-point IR matching alone is rejected as a universality criterion"
    kind: negative-control
    description: "Distinct nonlinear parents can share the same audited quadratic IR data."
  - id: QCCG_NONPERTURBATIVE_RG_FLOW
    title: "A nonperturbative QCCG coarse-graining flow for essential couplings is computed"
    kind: physics
    description: "Requires beta functions beyond canonical/IR scaling diagnostics."
  - id: ESSENTIAL_CRITICAL_EXPONENT_MATCH
    title: "QCCG essential UV critical exponents match the RFQG-5/asymptotic-safety target"
    kind: physics
    description: "Requires a controlled QCCG UV fixed point and essential relevant-direction spectrum."
  - id: AS_FIXED_POINT_MATCH
    title: "QCCG coarse graining reaches the RFQG-5/asymptotic-safety universality class"
    kind: physics
    description: "Requires critical exponents/essential observables compatible with the target Lorentzian fixed point."
    depends_on:
      - RG_BRIDGE_OBSERVABLES_EXTRACTED
      - IR_TWO_POINT_MATCH_INSUFFICIENT
      - QCCG_NONPERTURBATIVE_RG_FLOW
      - ESSENTIAL_CRITICAL_EXPONENT_MATCH
  - id: PHYSICAL_MASSLESS_SPIN2_CONTINUUM
    title: "A physical massless helicity-2 continuum sector is established"
    kind: physics
    description: "Requires derivation from the explicit parent, a Lorentzian manifold phase, common Lorentz cone, continuum gauge/BRST structure, physical unitarity, and an explicit physical spin-2 spectral identification."
    depends_on:
      - FULL_MICROSCOPIC_DERIVATION
      - CONTINUUM_MANIFOLD_PHASE
      - LORENTZ_UNIVERSALITY
      - CONTINUUM_DIFFEO_BRST
      - PHYSICAL_UNITARITY_SCALING_LIMIT
  - id: SOFT_GRAVITON_UNIVERSALITY_TARGET
    title: "Leading soft-graviton gauge consistency enforces universal coupling at the target continuum level"
    kind: formal-numerical
    description: "Universal coupling cancels the leading soft gauge variation by momentum conservation in the audited scattering target."
  - id: SOFT_NONUNIVERSAL_COUPLING_REJECTED
    title: "Species-dependent soft-graviton coupling fails a gauge-consistency negative control"
    kind: negative-control
    description: "A nonuniversal coupling assignment leaves a nonzero weighted momentum in the audited soft limit."
  - id: UNIVERSAL_COUPLING_PHYSICAL
    title: "QCCG physically realizes the soft-graviton universal coupling"
    kind: physics
    description: "Requires an actual physical massless spin-2 continuum S-matrix/soft limit, not only the conditional target theorem."
    depends_on:
      - SOFT_GRAVITON_UNIVERSALITY_TARGET
      - SOFT_NONUNIVERSAL_COUPLING_REJECTED
      - PHYSICAL_MASSLESS_SPIN2_CONTINUUM
  - id: GR_IR_EFFECTIVE_ACTION
    title: "The infrared physical effective action reproduces GR plus controlled corrections"
    kind: physics
    description: "Requires gauge-invariant continuum observables and the Einstein low-energy limit, not insertion of Einstein equations."
  - id: STRONG_GRAVITY_CTP
    title: "Real-time strong-gravity dynamics are controlled"
    kind: physics
    description: "Requires an in-in/CTP effective description for collapse or cosmology and causal physical observables."

evidence:
  - id: reciprocity-choice
    obligation: GEOMETRIC_RECIPROCITY
    status: MODEL_CHOICE
    engine: model-spec
    note: "Reciprocity is a microscopic dynamical principle, not derived from unitarity/locality/background independence."

claims:
  - id: QCCG_FINITE_WEYL_KINEMATICS
    title: "Finite-Weyl microscopic kinematics"
    rank: 10
    statement: "The audited pilot has a consistent finite local Weyl kinematics and controlled small-phase local terms."
    requires:
      - FINITE_WEYL_ALGEBRA
      - WEYL_QUADRATIC_LIMIT

  - id: QCCG_D4_RECIPROCITY_TOY
    title: "Conditional 4D reciprocity sector"
    rank: 20
    statement: "Given the declared reciprocity choice, the pilot algebraically selects D=4."
    requires:
      - FINITE_WEYL_ALGEBRA
      - id: GEOMETRIC_RECIPROCITY
        accept: [PASS, MODEL_CHOICE]
      - D4_RECIPROCITY_ALGEBRA

  - id: QCCG_QUADRATIC_TT_TOY
    title: "Model-internal two-branch z=1 quadratic tensor phase"
    rank: 30
    statement: "Within the declared quadratic flat-sector pilot, two massless tensor branches exhibit z=1 finite-size scaling while declared defect sectors remain gapped."
    requires:
      - FINITE_WEYL_ALGEBRA
      - WEYL_QUADRATIC_LIMIT
      - TT_QUADRATIC_SPECTRUM
      - FINITE_SIZE_GAP_SCALING
      - DEFECT_GAP_STABILITY

  - id: QCCG_PARENT_HESSIAN_TOY
    title: "Explicit finite-qudit parent yields the audited quadratic phase"
    rank: 40
    statement: "One fixed finite-Weyl local parent Hamiltonian yields the audited quadratic tensor/defect Hessian without fitting the Hessian independently."
    requires:
      - FULL_MICROSCOPIC_DERIVATION
      - TT_QUADRATIC_SPECTRUM
      - FINITE_SIZE_GAP_SCALING
      - DEFECT_GAP_STABILITY

  - id: QCCG_BARE_COMMON_CONE_TOY
    title: "Bare common-cone quadratic pilot"
    rank: 45
    statement: "Within the selected parent pilot, the audited tensor and probe-matter sectors share an isotropic bare cone and higher-derivative lattice violations are irrelevant; interacting RG protection is not claimed."
    requires:
      - id: COMMON_CAUSAL_PROPAGATOR
        accept: [PASS, MODEL_CHOICE]
      - BARE_SPATIAL_ISOTROPY
      - LATTICE_LV_IRRELEVANT

  - id: QCCG_QUADRATIC_UNITARY_SCALING_TOY
    title: "Unitary free quadratic scaling pilot"
    rank: 47
    statement: "The finite parent is unitary and a fixed free band-limited quadratic sector has an isometric norm-preserving continuum scaling limit."
    requires:
      - FINITE_PARENT_UNITARITY
      - QUADRATIC_SCALING_ISOMETRY

  - id: QCCG_LINEARIZED_SPIN2_TARGET
    title: "Consistent linearized spin-2 continuum target"
    rank: 43
    statement: "The audited continuum target has four linear first-class constraints and a rank-two TT sector; no claim is made that the microscopic parent generates the nonlinear gauge algebra."
    requires:
      - LINEARIZED_CONSTRAINT_ALGEBRA
      - TT_PROJECTOR_RANK2

  - id: QCCG_HDA_DESIGN_CONSTRAINT
    title: "Nonlinear constraint design rule"
    rank: 44
    statement: "The audited program rejects a mutually commuting nonlinear Hamiltonian-projector completion and requires noncommuting structure-function closure for the next microscopic construction."
    requires:
      - HDA_NONABELIAN_TARGET
      - COMMUTING_PROJECTOR_HDA_REJECTED

  - id: QCCG_CELLULATION_LIQUID_TOY
    title: "Finite cellulation-liquid vacuum pilot"
    rank: 35
    statement: "The audited finite move graph has a unique uniform cellulation-superposition zero mode and detects disconnected-vacuum degeneracy."
    requires:
      - CELLULATION_LIQUID_ZERO_MODE
      - CELLULATION_CONNECTIVITY_CONTROL

  - id: QCCG_STRUCTURE_FUNCTION_TOY
    title: "Finite constraint structure-function architecture toy"
    rank: 46
    statement: "A finite-dimensional QCCG-style toy realizes noncommuting operator-valued structure-function closure with Jacobi identity, a gapped common physical kernel, and a closure-failure negative control; GR HDA matching is not claimed."
    requires:
      - STRUCTURE_FUNCTION_CLOSURE_TOY
      - CONSTRAINT_KERNEL_GAP_TOY
      - STRUCTURE_FUNCTION_NEGATIVE_CONTROL

  - id: QCCG_EMERGENT_MASSLESS_SPIN2
    title: "Microscopically emergent physical massless spin-2 continuum"
    rank: 50
    statement: "A fully explicit QCCG parent Hamiltonian has a physical continuum containing only the required massless helicity-2 gravitational sector."
    requires:
      - PHYSICAL_MASSLESS_SPIN2_CONTINUUM

  - id: QCCG_GENERIC_NONLINEAR_PARENT_TOY
    title: "Finite-Weyl parent with stable generic cubic self-interaction"
    rank: 48
    statement: "The audited parent has a stable weak-coupling cubic collective interaction that leaves the free quadratic spectrum unchanged; GR vertex matching is not claimed."
    requires:
      - CUBIC_VERTEX_OBSTRUCTION_DETECTED
      - GENERIC_CUBIC_INTERACTION_REPAIR
      - CUBIC_VACUUM_STABILITY_CONTROL

  - id: QCCG_RG_BRIDGE_DATA_TOY
    title: "QCCG continuum-bridge observable package"
    rank: 49
    statement: "The audited parent exposes explicit pole, irrelevant-exponent and cubic observables for a future QCCG/RFQG universality test, and rejects two-point IR matching as sufficient evidence."
    requires:
      - RG_BRIDGE_OBSERVABLES_EXTRACTED
      - IR_TWO_POINT_MATCH_INSUFFICIENT

  - id: QCCG_DERIVATIVE_CUBIC_TOY
    title: "Derivative-cubic finite-Weyl repair"
    rank: 48
    statement: "The audited nonlinear parent replaces a non-derivative cubic proxy by a link-based finite-Weyl interaction whose continuum leading term is field-times-two-derivatives without changing the quadratic Hessian."
    requires:
      - NONDERIVATIVE_CUBIC_MISMATCH_DETECTED
      - DERIVATIVE_CUBIC_REPAIR

  - id: QCCG_RFQG_UNIVERSALITY
    title: "QCCG realizes the RFQG-5 continuum universality class"
    rank: 60
    statement: "QCCG coarse graining reaches the same physical Lorentzian UV-complete universality class audited by RFQG-5."
    requires:
      - AS_FIXED_POINT_MATCH
      - CONTINUUM_DIFFEO_BRST
      - PHYSICAL_UNITARITY_SCALING_LIMIT

  - id: QCCG_SOFT_UNIVERSALITY_TARGET
    title: "Conditional soft-graviton universality target"
    rank: 42
    statement: "At the target massless spin-2 continuum level, universal coupling satisfies the audited leading soft gauge-consistency condition while a nonuniversal assignment fails."
    requires:
      - SOFT_GRAVITON_UNIVERSALITY_TARGET
      - SOFT_NONUNIVERSAL_COUPLING_REJECTED

  - id: QCCG_GR_IR
    title: "QCCG/RFQG yields general relativity in the infrared"
    rank: 70
    statement: "The continuum physical effective action reproduces GR in the infrared with controlled corrections."
    requires:
      - AS_FIXED_POINT_MATCH
      - GR_IR_EFFECTIVE_ACTION
      - CONTINUUM_DIFFEO_BRST
      - PHYSICAL_UNITARITY_SCALING_LIMIT

  - id: QCCG_STRONG_GRAVITY
    title: "QCCG/RFQG controlled strong-gravity dynamics"
    rank: 80
    statement: "The unified theory supplies a controlled causal real-time strong-gravity evolution."
    requires:
      - AS_FIXED_POINT_MATCH
      - GR_IR_EFFECTIVE_ACTION
      - CONTINUUM_DIFFEO_BRST
      - PHYSICAL_UNITARITY_SCALING_LIMIT
      - STRONG_GRAVITY_CTP
