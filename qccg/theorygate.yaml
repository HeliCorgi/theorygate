version: "0.5"
model:
  id: qccg-rfqg-bridge
  title: "QCCG × RFQG continuum-bridge audit"
  choices:
    scope: "finite-Weyl quadratic flat-sector pilot; not a full QCCG many-body solution"
    local_register: "finite K-state Weyl qudit"
    reciprocity: "2-cell / dual-2-cell geometric reciprocity"
    quadratic_background: "periodic flat lattice Hessian"
    continuum_target: "Lorentzian asymptotic-safety / RFQG-5 universality class"

obligations:
  - id: FINITE_WEYL_ALGEBRA
    title: "Finite local Weyl algebra is realized"
    kind: formal-numerical
    description: "A finite K-state register realizes ZX=omega XZ and bounded local Weyl operators."
  - id: WEYL_QUADRATIC_LIMIT
    title: "Finite Weyl plaquette term has a controlled quadratic small-phase limit"
    kind: numerical
    description: "For preregistered finite K values, 2-W-W† approaches Q^2 at the declared tolerance."
  - id: GEOMETRIC_RECIPROCITY
    title: "Geometric reciprocity is declared"
    kind: physical-choice
    description: "Curvature 2-cells and conjugate dual flux use the same elementary register type."
  - id: D4_RECIPROCITY_ALGEBRA
    title: "The reciprocity dimension relation selects D=4"
    kind: formal
    description: "Given geometric reciprocity, 2=D-2 has the unique integer solution D=4."
  - id: TT_QUADRATIC_SPECTRUM
    title: "Declared quadratic Hessian has exactly two massless tensor branches"
    kind: numerical
    description: "The flat-sector quadratic Hessian has two zero branches and no zero defect branch at finite periodic volume."
  - id: FINITE_SIZE_GAP_SCALING
    title: "First tensor excitation scales as 1/L"
    kind: robustness
    description: "The first nonzero tensor frequency obeys preregistered z=1 finite-size scaling over the declared lattice sizes."
  - id: DEFECT_GAP_STABILITY
    title: "Declared scalar/vector defect sectors remain gapped"
    kind: robustness
    description: "The model-internal defect mass remains nonzero under the same finite-size scan."
  - id: FULL_MICROSCOPIC_DERIVATION
    title: "The quadratic tensor Hessian is derived from one fully explicit interacting finite-qudit parent Hamiltonian"
    kind: physics
    description: "Requires a fixed microscopic Hamiltonian and controlled derivation, not coefficient tuning of the Hessian."
  - id: CELLULATION_LIQUID_ZERO_MODE
    title: "The local-move Hamiltonian admits a unique uniform cellulation-liquid zero mode"
    kind: formal-numerical
    description: "On a connected audited cellulation-move graph, H_move is a positive graph Laplacian with unique uniform zero state."
  - id: CELLULATION_CONNECTIVITY_CONTROL
    title: "Disconnected move graphs are detected as degenerate-vacuum failures"
    kind: negative-control
    description: "A disconnected cellulation-move graph must produce multiple zero modes."
  - id: MANIFOLD_DIAGNOSTIC_CALIBRATED
    title: "Spectral and volume-growth manifold-dimension diagnostics are calibrated"
    kind: numerical
    description: "A preregistered classifier identifies a known 4D periodic reference from spectral dimension and volume growth."
  - id: MANIFOLD_DIMENSION_CONTROLS
    title: "The calibrated manifold-dimension diagnostic rejects 3D and 5D controls"
    kind: negative-control
    description: "Known 3D and 5D periodic references must not be classified as 4D."
  - id: PACHNER_4D_MANIFOLD_TOPOLOGY_CONTROL
    title: "Explicit Pachner-generated ensembles preserve closed combinatorial 4-manifold incidence"
    kind: formal-numerical
    description: "Audited 1->5 and 2->4 Pachner moves preserve two 4-simplex incidences per tetrahedral face."
  - id: UNWEIGHTED_PACHNER_DIMENSION_FAILURE_DETECTED
    title: "An unweighted topologically 4D Pachner ensemble is rejected as a 4D metric-scaling phase"
    kind: negative-control
    description: "Spectral and volume-growth dimensions remain far below four despite correct combinatorial manifold topology."
  - id: PACHNER_MOVESET_REPAIR_INSUFFICIENT
    title: "Adding 2->4 Pachner moves alone is insufficient to recover a 4D metric phase"
    kind: negative-control
    description: "A broader reversible-move architecture and nontrivial geometric weighting are required."
  - id: REGGE_WEIGHTED_PACHNER_SCAN_EXECUTED
    title: "A finite reversible Regge-like weighted Pachner scan is executed"
    kind: numerical
    description: "A 1<->5 and 2<->4 Metropolis-Hastings toy with N2 weighting and volume fixing preserves closed 4-manifold incidence."
  - id: SIMPLE_REGGE_WEIGHT_REPAIR_INSUFFICIENT
    title: "A simple Euclidean Regge-like N2 weight is insufficient in the audited finite scan"
    kind: negative-control
    description: "No preregistered finite kappa2 point reaches even the broad spectral/volume four-dimensional target."
  - id: CAUSAL_FOLIATED_4D_ARCHITECTURE
    title: "A finite 4D foliated causal simplicial architecture is explicitly constructed"
    kind: formal-numerical
    description: "Adjacent-time (4,1)/(3,2)/(2,3)/(1,4) simplices form a 4D simplicial cylinder with correct interior and spatial-boundary incidence."
  - id: CAUSAL_FOLIATION_NEGATIVE_CONTROL
    title: "Nonadjacent-time simplices are detected as causal/foliation violations"
    kind: negative-control
    description: "A deliberately inserted time-skipping simplex fails the causal building-block rule."
  - id: CAUSAL_LOCAL_MOVESET_TOY
    title: "A finite causal foliated complex admits reversible local 2<->4 Pachner moves"
    kind: formal-numerical
    description: "Accepted local moves remain inside the adjacent-slice manifold class and possess exact inverse moves."
  - id: CAUSAL_MOVE_HERMITIAN_TOY
    title: "The finite causal move graph defines a Hermitian positive move Hamiltonian"
    kind: formal-numerical
    description: "The audited finite accepted-move graph Laplacian is Hermitian positive semidefinite with a unique uniform zero mode."
  - id: CAUSAL_MOVE_NEGATIVE_CONTROL
    title: "Time-skipping local replacements are rejected by the causal move audit"
    kind: negative-control
    description: "A deliberately nonadjacent-time local replacement must fail the same causal/manifold validator."
  - id: CAUSAL_MOVE_ENSEMBLE_SCAN_EXECUTED
    title: "A finite reversible causal-move ensemble scan is executed with detailed-balance control"
    kind: numerical
    description: "The finite causal ensemble preserves foliation/manifold constraints and checks proposal-count Metropolis detailed balance."
  - id: CAUSAL_FINITE_4D_CANDIDATE
    title: "The finite causal-move ensemble reaches a broad four-dimensional geometry diagnostic"
    kind: physics
    description: "A finite-volume diagnostic only; PASS does not establish a continuum four-dimensional phase and FAIL is a valid negative result."
  - id: CAUSAL_FIXED_VERTEX_MOVESET_INSUFFICIENT
    title: "The fixed-vertex causal 2<->4 move ensemble is diagnosed as insufficient when it fails the finite 4D geometry target"
    kind: negative-control
    description: "The local 2<->4 move set preserves the microscopic vertex set, so a failed extended-geometry diagnostic motivates vertex-changing causal moves."
  - id: CAUSAL_COLUMN_MOVESET_TOY
    title: "Vertex-changing causal-column spatial Pachner moves preserve the finite causal 4-manifold architecture"
    kind: formal-numerical
    description: "Spatial 1<->4 and 2<->3 moves change vertices/connectivity while staircase time extension preserves causal manifold incidence."
  - id: CAUSAL_COLUMN_ENSEMBLE_SCAN_EXECUTED
    title: "A finite vertex-changing causal-column ensemble scan is executed"
    kind: numerical
    description: "The repaired ensemble is sampled with proposal-count detailed balance and spatial/4D manifold checks."
  - id: CAUSAL_COLUMN_FINITE_4D_CANDIDATE
    title: "The finite causal-column repair reaches a broad four-dimensional geometry diagnostic"
    kind: physics
    description: "A finite diagnostic only; PASS does not establish scaling and FAIL is a valid negative result."
  - id: CAUSAL_COLUMN_REPAIR_INSUFFICIENT
    title: "Repeating one vertex-changing spatial triangulation through time is diagnosed as insufficient when the 4D target fails"
    kind: negative-control
    description: "The repair removes the fixed-vertex defect but may still fail because every time slice shares one spatial geometry."
  - id: TIME_LOCAL_SLICE_TRANSFER_TOY
    title: "A finite spatial-triangulation state graph supports nearest-time local transfer dynamics"
    kind: formal-numerical
    description: "Adjacent discrete times may carry distinct spatial geometries related by one reversible Pachner move, with a Hermitian connected move graph."
  - id: TIME_NONLOCAL_JUMP_NEGATIVE_CONTROL
    title: "A two-move geometry jump is rejected by the nearest-time transfer rule"
    kind: negative-control
    description: "States at graph distance two are not direct one-step temporal neighbors."
  - id: PACHNER_4SIMPLEX_COBORDISM_TOY
    title: "Spatial 1<->4 and 2<->3 Pachner moves admit local 4-simplex cobordism blocks"
    kind: formal-numerical
    description: "Complementary tetrahedral facet sets of one 4-simplex realize the spatial Pachner transitions with identical boundary 2-complexes."
  - id: PACHNER_COBORDISM_INVERSE_CONTROL
    title: "The local Pachner cobordism blocks have exact complementary inverse moves"
    kind: negative-control
    description: "Swapping lower/upper facet sets realizes 4->1 and 3->2 inverse cobordisms."
  - id: PACHNER_COBORDISM_COMPOSITION_TOY
    title: "Sequential local 4-simplex Pachner cobordisms compose to a 4D manifold-with-boundary"
    kind: formal-numerical
    description: "Two local refinement blocks glue along one tetrahedron with incidence two and a tree-like causal attachment graph."
  - id: PACHNER_COBORDISM_OVERGLUE_NEGATIVE_CONTROL
    title: "Overgluing an already-internal tetrahedron is detected"
    kind: negative-control
    description: "A third simplex attached to an internal tetrahedron creates incidence three and is rejected."
  - id: STRICT_SLAB_GLUE_INCIDENCE_LEMMA
    title: "Axiom-free formal slab-gluing incidence lemma"
    kind: formal
    description: "Given incidence one on each copy of an interface face, gluing gives incidence two; external incidence and adjacent-layer arithmetic are preserved. Physical complexes must establish the hypotheses separately."
  - id: STRICT_23_ROUNDTRIP_COMPOSITION_TOY
    title: "Strict 2->3 and 3->2 causal slabs compose through one shared intermediate slice"
    kind: formal-numerical
    description: "The explicit slabs glue on the same t=1 triangulation so the middle spatial tetrahedra have incidence two and disappear from the external boundary."
  - id: STRICT_SLAB_GLUE_NEGATIVE_CONTROL
    title: "Incorrectly duplicated intermediate slice vertices are detected"
    kind: negative-control
    description: "Using a distinct copy of the middle slice prevents exact slab composition and leaves disconnection or spurious intermediate boundary."
  - id: QCCG_STRICT_FOLIATION_COMPOSITION
    title: "Mixed local cobordism histories admit one strict equal-time global foliation"
    kind: physics
    description: "Requires globally consistent slice labels for arbitrary compositions, beyond the finite round-trip composition toy."
    depends_on:
      - STRICT_SLAB_GLUE_INCIDENCE_LEMMA
      - STRICT_23_ROUNDTRIP_COMPOSITION_TOY
      - STRICT_SLAB_GLUE_NEGATIVE_CONTROL
  - id: QCCG_GLOBAL_CAUSAL_COBORDISM_COMPATIBILITY
    title: "Arbitrary compositions of local Pachner cobordisms admit one consistent global causal foliation"
    kind: physics
    description: "Requires global time labels, manifold incidence and no time-skipping simplices after composing local 4D blocks."
    depends_on:
      - PACHNER_COBORDISM_COMPOSITION_TOY
      - PACHNER_COBORDISM_OVERGLUE_NEGATIVE_CONTROL
      - QCCG_STRICT_FOLIATION_COMPOSITION
  - id: CAUSAL_14_SPACETIME_SLAB_TOY
    title: "A strict adjacent-slice 4D slab realizes a spatial 1<->4 refinement"
    kind: formal-numerical
    description: "A tetrahedron-time staircase prism with an upper-slice stellar refinement gives the expected lower and refined upper spatial boundaries while preserving causal 4D manifold incidence."
  - id: CAUSAL_14_SLAB_INVERSE_CONTROL
    title: "The strict 1<->4 causal slab has an exact local inverse"
    kind: formal-numerical
    description: "Collapsing the upper refinement vertex reconstructs the original tetrahedron-time prism."
  - id: CAUSAL_14_SLAB_TIME_SKIP_CONTROL
    title: "Wrong-time refinement vertices are rejected in the strict 1<->4 slab"
    kind: negative-control
    description: "Moving the new upper vertex beyond the adjacent slice creates invalid nonlocal-time simplices."
  - id: CAUSAL_23_SPACETIME_SLAB_REALIZATION
    title: "A strict adjacent-slice 4D slab realizes a spatial 2<->3 Pachner transition"
    kind: formal-numerical
    description: "An explicit nine-simplex adjacent-slice slab has exactly the old two-tetrahedron lower boundary, new three-tetrahedron upper boundary, common lateral boundary and incidence-two interior."
  - id: CAUSAL_23_SLAB_INVERSE_CONTROL
    title: "The strict 2<->3 causal slab has an exact time-reversed inverse"
    kind: formal-numerical
    description: "Swapping lower and upper vertex copies gives a valid strict 3->2 slab with the reversed prescribed boundary."
  - id: CAUSAL_23_SLAB_COMPLETENESS_CONTROL
    title: "Missing 4-simplices are detected in the strict 2<->3 slab"
    kind: negative-control
    description: "Deleting any one required 4-simplex breaks the prescribed boundary or manifold incidence."
  - id: CLOSED_SLICE_14_CAUSAL_SLAB_TOY
    title: "A local 1->4 strict slab embeds into a complete closed S3 slice transition"
    kind: formal-numerical
    description: "A full S3 x interval product slab with one upper-boundary stellar refinement remains causal/manifold and has no mixed-time external boundary."
  - id: CLOSED_SLICE_23_CAUSAL_SLAB_TOY
    title: "A local 2->3 strict slab embeds into a complete closed S3 slice transition"
    kind: formal-numerical
    description: "Replacing the product subcomplex of a valid 2->3 pair by the nine-simplex strict slab yields a causal/manifold closed-slice transition with only full lower/upper S3 boundaries."
  - id: CLOSED_SLICE_SLAB_COMPLETION_CONTROL
    title: "Missing local slab simplices are detected after closed-slice completion"
    kind: negative-control
    description: "Deleting a required replacement simplex creates boundary or incidence defects in the completed closed-slice slab."
  - id: GENERIC_LOCAL_SLAB_BUILDER_SCAN
    title: "Constructive local strict-slab builders survive a multi-triangulation closed-S3 stress scan"
    kind: numerical
    description: "Deterministic random closed S3 triangulations are grown and both 1->4 and incidence-canonicalized 2->3 closed-slice slab builders are re-audited."
  - id: LOCAL_SLAB_LABEL_GAUGE_CONTROL
    title: "Numeric vertex labels are rejected as physical input to the local 2->3 slab builder"
    kind: negative-control
    description: "A naive numeric-order role assignment fails on a relabelled 2->3 move; incidence-based canonical roles preserve the label-gauge principle."
  - id: QCCG_LOCAL_SPACETIME_SLAB_REALIZATION
    title: "Every allowed neighboring spatial slice pair has a bounded-time 4D causal simplicial interpolation"
    kind: physics
    description: "Requires explicit strict-foliation local Pachner slabs plus globally composable causal foliation."
    depends_on:
      - PACHNER_4SIMPLEX_COBORDISM_TOY
      - PACHNER_COBORDISM_INVERSE_CONTROL
      - CAUSAL_14_SPACETIME_SLAB_TOY
      - CAUSAL_14_SLAB_INVERSE_CONTROL
      - CAUSAL_14_SLAB_TIME_SKIP_CONTROL
      - CAUSAL_23_SPACETIME_SLAB_REALIZATION
      - CAUSAL_23_SLAB_INVERSE_CONTROL
      - CAUSAL_23_SLAB_COMPLETENESS_CONTROL
      - CLOSED_SLICE_14_CAUSAL_SLAB_TOY
      - CLOSED_SLICE_23_CAUSAL_SLAB_TOY
      - CLOSED_SLICE_SLAB_COMPLETION_CONTROL
      - GENERIC_LOCAL_SLAB_BUILDER_SCAN
      - LOCAL_SLAB_LABEL_GAUGE_CONTROL
  - id: CDT_MOVE4_VERTEX_REFINEMENT_TOY
    title: "A local 4D causal vertex-changing 2->8 refinement move is realized"
    kind: formal-numerical
    description: "A spatial vertex is inserted within one slice and the surrounding (1,4)/(4,1) pair is refined to eight causal 4-simplices."
  - id: CDT_MOVE4_BOUNDARY_PRESERVATION
    title: "The local 2->8 causal refinement preserves the external subcomplex boundary and manifold incidence"
    kind: formal-numerical
    description: "The move preserves the tetrahedral boundary and adjacent-time simplex types."
  - id: CDT_MOVE4_INVERSE_CONTROL
    title: "The local vertex-changing causal move has an exact 8->2 inverse"
    kind: formal-numerical
    description: "The inserted spatial vertex has coordination eight and supports exact collapse."
  - id: CDT_MOVE4_TIME_SKIP_NEGATIVE_CONTROL
    title: "Wrong-time insertion is rejected by the causal move audit"
    kind: negative-control
    description: "A refinement vertex placed outside the adjacent slice structure creates invalid causal simplices."
  - id: CDT_MOVE46_CONNECTIVITY_TOY
    title: "A local 4D causal connectivity-changing 4->6 move is realized"
    kind: formal-numerical
    description: "A shared spatial triangle is replaced by its dual spatial edge while preserving the external causal subcomplex boundary."
  - id: CDT_MOVE46_BOUNDARY_PRESERVATION
    title: "The local 4->6 causal move preserves manifold incidence and adjacent-time simplex structure"
    kind: formal-numerical
    description: "The connectivity-changing move stays within the causal manifold class."
  - id: CDT_MOVE46_INVERSE_CONTROL
    title: "The local 4->6 causal connectivity move has an exact 6->4 inverse signal"
    kind: formal-numerical
    description: "The new spatial edge has coordination six."
  - id: CDT_MOVE46_TIME_SKIP_NEGATIVE_CONTROL
    title: "Wrong-time connectivity moves are rejected"
    kind: negative-control
    description: "Moving a spatial vertex outside the adjacent slice structure invalidates the causal simplex types."
  - id: CDT_MOVE33_SELFDUAL_TOY
    title: "A local 4D causal self-dual 3->3 move is realized"
    kind: formal-numerical
    description: "A timelike coordination-three triangle is exchanged with its dual timelike triangle without changing simplex count."
  - id: CDT_MOVE33_BOUNDARY_PRESERVATION
    title: "The local 3->3 causal move preserves manifold incidence and boundary"
    kind: formal-numerical
    description: "The self-dual move remains in the adjacent-time causal manifold class."
  - id: CDT_MOVE33_TIME_SKIP_NEGATIVE_CONTROL
    title: "Wrong-time self-dual moves are rejected"
    kind: negative-control
    description: "A vertex outside adjacent time slices invalidates the causal 3->3 move."
  - id: CDT_MIXED_MOVE_FIXED_BOUNDARY_CONNECTIVITY_TOY
    title: "A finite mixed causal-move fixed-boundary sector is connected"
    kind: formal-numerical
    description: "A connected 4D manifold-with-boundary built from 2<->8, 4<->6 and 3<->3 local move patches has all eight local configurations in one move-graph component with identical external boundary."
  - id: CDT_MOVE_FAMILY_CONNECTIVITY_CONTROL
    title: "Removing a required move family is detected as finite-sector disconnection"
    kind: negative-control
    description: "The finite mixed-sector connectivity audit must split when one move family is removed."
  - id: CDT_CONNECTIVITY_SCALING_TOY
    title: "A constructive mixed-CDT fixed-boundary sector remains connected under finite size increase"
    kind: formal-numerical
    description: "Independent audited local move patches are glued through increasing depth and all 2^m configurations remain causal manifolds with one external boundary and a connected move graph."
  - id: CDT_CONNECTIVITY_SCALING_NEGATIVE_CONTROL
    title: "Removing one move bit splits the largest constructive connectivity sector"
    kind: negative-control
    description: "The largest audited mixed-patch state graph must split when its final local move direction is removed."
  - id: CDT_MOVE_INVARIANT_AUDIT
    title: "Simple f-vector invariants of the realized causal move set are audited"
    kind: formal-numerical
    description: "Move deltas are checked for Euler/incidence identities and unexpected component-wise modular conservation laws."
  - id: CDT_BOUNDARY_MODULAR_INVARIANTS_EXPLAINED
    title: "Visible f3 mod-5 and f4 mod-2 invariants are explained by fixed-boundary incidence"
    kind: formal-numerical
    description: "The apparent modular invariants follow from 2 Δf3 = 5 Δf4 with fixed tetrahedral boundary."
  - id: QCCG_CDT_GENERIC_INVARIANT_SEARCH
    title: "Generic nonlocal conserved invariants of causal triangulation sectors are excluded"
    kind: physics
    description: "Requires scalable state-graph sampling beyond f-vector invariants."
  - id: QCCG_CDT_SCALABLE_CONNECTIVITY
    title: "Fixed-boundary causal move graphs remain connected across increasing generic triangulation sectors"
    kind: physics
    description: "Requires scalable enumeration/sampling and conserved-invariant searches beyond the finite constructive glued family."
    depends_on:
      - CDT_CONNECTIVITY_SCALING_TOY
      - CDT_CONNECTIVITY_SCALING_NEGATIVE_CONTROL
      - CDT_MOVE_INVARIANT_AUDIT
      - CDT_BOUNDARY_MODULAR_INVARIANTS_EXPLAINED
      - QCCG_CDT_GENERIC_INVARIANT_SEARCH
  - id: QCCG_CDT_MOVESET_ERGODICITY
    title: "The realized local 4D causal move set is ergodic within the intended fixed-boundary causal triangulation sectors"
    kind: physics
    description: "Requires finite-state connectivity tests followed by scalable evidence; individual local move realizations are insufficient."
    depends_on:
      - CDT_MIXED_MOVE_FIXED_BOUNDARY_CONNECTIVITY_TOY
      - CDT_MOVE_FAMILY_CONNECTIVITY_CONTROL
      - QCCG_CDT_SCALABLE_CONNECTIVITY
  - id: QCCG_CDT_LOCAL_MOVESET_COMPLETENESS
    title: "QCCG realizes a complete reversible local 4D causal move set with fixed-boundary connectivity"
    kind: physics
    description: "Requires the audited 2<->4, 2<->8, 4<->6 and 3<->3 causal move architectures plus connectivity/ergodicity."
    depends_on:
      - CAUSAL_LOCAL_MOVESET_TOY
      - CDT_MOVE4_VERTEX_REFINEMENT_TOY
      - CDT_MOVE46_CONNECTIVITY_TOY
      - CDT_MOVE33_SELFDUAL_TOY
      - QCCG_CDT_MOVESET_ERGODICITY
  - id: QCCG_TIME_LOCAL_CAUSAL_DYNAMICS
    title: "QCCG has bounded-time-neighborhood local causal graph dynamics with independently evolving spatial slices"
    kind: physics
    description: "Requires slice-dependent geometries and a sufficiently complete foliation-preserving local 4D move set."
    depends_on:
      - TIME_LOCAL_SLICE_TRANSFER_TOY
      - TIME_NONLOCAL_JUMP_NEGATIVE_CONTROL
      - CDT_MOVE4_VERTEX_REFINEMENT_TOY
      - CDT_MOVE4_BOUNDARY_PRESERVATION
      - CDT_MOVE4_INVERSE_CONTROL
      - CDT_MOVE4_TIME_SKIP_NEGATIVE_CONTROL
      - CDT_MOVE46_CONNECTIVITY_TOY
      - CDT_MOVE46_BOUNDARY_PRESERVATION
      - CDT_MOVE46_INVERSE_CONTROL
      - CDT_MOVE46_TIME_SKIP_NEGATIVE_CONTROL
      - CDT_MOVE33_SELFDUAL_TOY
      - CDT_MOVE33_BOUNDARY_PRESERVATION
      - CDT_MOVE33_TIME_SKIP_NEGATIVE_CONTROL
      - QCCG_CDT_LOCAL_MOVESET_COMPLETENESS
  - id: CAUSAL_4D_SCALING_STABILITY
    title: "The causal-move ensemble has a stable four-dimensional scaling phase at increasing volume and time extent"
    kind: physics
    description: "Requires finite-size scaling and coupling-window stability beyond a single finite ensemble."
  - id: QCCG_CAUSAL_MOVE_DYNAMICS
    title: "QCCG has a reversible local graph-changing dynamics closed within the causal foliated cellulation class"
    kind: physics
    description: "Requires an ergodic foliation-preserving move set and compatible Hermitian/weighted dynamics."
    depends_on:
      - CAUSAL_LOCAL_MOVESET_TOY
      - CAUSAL_MOVE_HERMITIAN_TOY
      - CAUSAL_MOVE_NEGATIVE_CONTROL
      - CAUSAL_MOVE_ENSEMBLE_SCAN_EXECUTED
  - id: QCCG_CAUSAL_CRITICAL_CELLULATION_DYNAMICS
    title: "QCCG realizes a causal/foliated weighted cellulation dynamics with a stable 4D critical phase"
    kind: physics
    description: "Requires stronger geometric/causal structure beyond the failed uniform and simple Euclidean Regge-weighted ensembles."
    depends_on:
      - CAUSAL_FOLIATED_4D_ARCHITECTURE
      - CAUSAL_FOLIATION_NEGATIVE_CONTROL
      - QCCG_CAUSAL_MOVE_DYNAMICS
      - QCCG_TIME_LOCAL_CAUSAL_DYNAMICS
      - CAUSAL_4D_SCALING_STABILITY
  - id: QCCG_WEIGHTED_CRITICAL_CELLULATION_ENSEMBLE
    title: "QCCG specifies and realizes a weighted critical cellulation ensemble with 4D manifold-like scaling"
    kind: physics
    description: "Requires reversible graph dynamics and a stable four-dimensional critical phase after the simple Regge-weighted repair has been stress-tested."
    depends_on:
      - REGGE_WEIGHTED_PACHNER_SCAN_EXECUTED
      - SIMPLE_REGGE_WEIGHT_REPAIR_INSUFFICIENT
      - QCCG_CAUSAL_CRITICAL_CELLULATION_DYNAMICS
  - id: QCCG_CELLULATION_GEOMETRY_MEASURED
    title: "Actual QCCG cellulation ensembles are measured with the calibrated geometry diagnostics"
    kind: physics
    description: "Requires increasing-size QCCG-generated weighted cellulation ensembles, not reference lattices or unweighted Pachner negative controls."
    depends_on:
      - PACHNER_4D_MANIFOLD_TOPOLOGY_CONTROL
      - UNWEIGHTED_PACHNER_DIMENSION_FAILURE_DETECTED
      - PACHNER_MOVESET_REPAIR_INSUFFICIENT
      - QCCG_WEIGHTED_CRITICAL_CELLULATION_ENSEMBLE
  - id: MANIFOLD_LIKENESS_SCALING
    title: "The cellulation liquid has a smooth 3+1 Lorentzian manifold-like scaling phase"
    kind: physics
    description: "Requires scaling evidence for dimension, signature, locality and manifold-likeness."
    depends_on:
      - MANIFOLD_DIAGNOSTIC_CALIBRATED
      - MANIFOLD_DIMENSION_CONTROLS
      - QCCG_CELLULATION_GEOMETRY_MEASURED
  - id: CONTINUUM_MANIFOLD_PHASE
    title: "The critical phase reconstructs a smooth 3+1 Lorentzian continuum"
    kind: physics
    description: "Requires manifold-likeness, signature and continuum reconstruction beyond the finite cellulation-liquid pilot."
    depends_on:
      - CELLULATION_LIQUID_ZERO_MODE
      - CELLULATION_CONNECTIVITY_CONTROL
      - MANIFOLD_LIKENESS_SCALING
  - id: COMMON_CAUSAL_PROPAGATOR
    title: "A common microscopic causal propagation coefficient is declared"
    kind: physical-choice
    description: "Tensor and probe-matter sectors use one bare propagation coefficient; this is a model principle rather than an RG result."
  - id: BARE_SPATIAL_ISOTROPY
    title: "The selected quadratic parent has a common isotropic bare cone"
    kind: numerical
    description: "Cubic-symmetric spatial links and the shared propagation coefficient give the audited species one bare z=1 cone."
  - id: LATTICE_LV_IRRELEVANT
    title: "Higher-derivative lattice Lorentz violation is irrelevant"
    kind: rg-analytic
    description: "Four-derivative lattice corrections scale away relative to the two-derivative kinetic term."
  - id: MARGINAL_LV_STABILITY
    title: "The common cone is stable against marginal/relevant Lorentz-violating deformations"
