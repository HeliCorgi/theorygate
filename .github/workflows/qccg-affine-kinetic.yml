name: QCCG affine kinetic probe

on:
  pull_request:
    paths:
      - "qccg/run_qccg_cdt_affine_kinetic_audit.py"
      - "qccg/run_qccg_equilibrated_critical_line.py"
      - "qccg/theorygate.yaml"
      - ".github/workflows/qccg-affine-kinetic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run affine CDT kinetic audit
        run: |
          mkdir -p artifacts/qccg-affine
          python qccg/run_qccg_cdt_affine_kinetic_audit.py \
            --out artifacts/qccg-affine/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qccg-affine-kinetic
          path: artifacts/qccg-affine/
