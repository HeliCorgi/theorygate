name: QCCG bridge audit

on:
  push:
    paths:
      - "qccg/**"
      - "theorygate/**"
      - "pyproject.toml"
      - ".github/workflows/qccg-audit.yml"
  pull_request:
    paths:
      - "qccg/**"
      - "theorygate/**"
      - "pyproject.toml"
      - ".github/workflows/qccg-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qccg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Run scoped QCCG calculation
        run: |
          python qccg/run_quadratic_audit.py \
            --out artifacts/qccg/evidence.json \
            --summary artifacts/qccg/summary.json

      - name: Derive quadratic Hessian from explicit finite-Weyl parent
        run: |
          python qccg/run_parent_hamiltonian_audit.py \
            --out artifacts/qccg/parent-evidence.json

      - name: Audit Lorentz-universality obstruction and bare-cone repair
        run: |
          python qccg/run_lorentz_audit.py \
            --out artifacts/qccg/lorentz-evidence.json

      - name: Audit finite and quadratic scaling unitarity
        run: |
          python qccg/run_unitarity_audit.py \
            --out artifacts/qccg/unitarity-evidence.json

      - name: Audit interacting scaling-isometry architecture
        run: |
          python qccg/run_interacting_scaling_toy.py \
            --out artifacts/qccg/interacting-scaling-evidence.json

      - name: Audit graph-changing scaling isometry
        run: |
          python qccg/run_graph_change_scaling_toy.py \
            --out artifacts/qccg/graph-change-scaling-evidence.json

      - name: Audit linearized spin-2 constraint target
        run: |
          python qccg/run_linearized_constraint_audit.py \
            --out artifacts/qccg/constraint-evidence.json

      - name: Reject naive commuting-projector nonlinear completion
        run: |
          python qccg/run_nonlinear_constraint_diagnostic.py \
            --out artifacts/qccg/nonlinear-constraint-evidence.json

      - name: Audit cellulation-liquid vacuum
        run: |
          python qccg/run_cellulation_liquid_audit.py \
            --out artifacts/qccg/cellulation-evidence.json

      - name: Calibrate manifold-likeness diagnostics
        run: |
          python qccg/run_manifold_diagnostic_audit.py \
            --out artifacts/qccg/manifold-diagnostic-evidence.json

      - name: Audit explicit 4D Pachner cellulation ensemble
        run: |
          python qccg/run_pachner_ensemble_audit.py \
            --out artifacts/qccg/pachner-evidence.json

      - name: Detect and repair missing cubic interaction
        run: |
          python qccg/run_cubic_interaction_audit.py \
            --out artifacts/qccg/cubic-evidence.json

      - name: Refine cubic repair to derivative interaction
        run: |
          python qccg/run_derivative_cubic_audit.py \
            --out artifacts/qccg/derivative-cubic-evidence.json

      - name: Audit finite structure-function constraint toy
        run: |
          python qccg/run_structure_function_toy.py \
            --out artifacts/qccg/structure-function-evidence.json

      - name: Audit emergent noncentral structure functions on code subspace
        run: |
          python qccg/run_emergent_structure_function_audit.py \
            --out artifacts/qccg/emergent-structure-evidence.json

      - name: Extract QCCG RFQG bridge observables
        run: |
          python qccg/run_rg_bridge_audit.py \
            --out artifacts/qccg/rg-bridge-evidence.json

      - name: Run exact finite-state RG blocking toy
        run: |
          python qccg/run_exact_rg_toy.py \
            --out artifacts/qccg/exact-rg-evidence.json

      - name: Audit Feshbach effective-kernel coarse graining
        run: |
          python qccg/run_feshbach_rg_toy.py \
            --out artifacts/qccg/feshbach-evidence.json

      - name: Audit cellulation-sector exact coarse graining
        run: |
          python qccg/run_cellulation_rg_toy.py \
            --out artifacts/qccg/cellulation-rg-evidence.json

      - name: Calibrate GR cubic Ward target
        run: |
          python qccg/run_gr_cubic_ward_target.py \
            --out artifacts/qccg/gr-cubic-ward-evidence.json

      - name: Audit finite-Weyl tensor cubic Ward construction
        run: |
          python qccg/run_tensor_cubic_lattice_audit.py \
            --out artifacts/qccg/tensor-cubic-evidence.json

      - name: Audit soft-graviton universal coupling target
        run: |
          python qccg/run_soft_graviton_audit.py \
            --out artifacts/qccg/soft-graviton-evidence.json

      - name: Validate audit model
        run: theorygate validate qccg/theorygate.yaml

      - name: Require only the scoped quadratic claim
        run: |
          theorygate check qccg/theorygate.yaml \
            --evidence artifacts/qccg/evidence.json \
            --evidence artifacts/qccg/parent-evidence.json \
            --evidence artifacts/qccg/lorentz-evidence.json \
            --evidence artifacts/qccg/unitarity-evidence.json \
            --evidence artifacts/qccg/interacting-scaling-evidence.json \
            --evidence artifacts/qccg/graph-change-scaling-evidence.json \
            --evidence artifacts/qccg/constraint-evidence.json \
            --evidence artifacts/qccg/nonlinear-constraint-evidence.json \
            --evidence artifacts/qccg/cellulation-evidence.json \
            --evidence artifacts/qccg/manifold-diagnostic-evidence.json \
            --evidence artifacts/qccg/pachner-evidence.json \
            --evidence artifacts/qccg/cubic-evidence.json \
            --evidence artifacts/qccg/derivative-cubic-evidence.json \
            --evidence artifacts/qccg/structure-function-evidence.json \
            --evidence artifacts/qccg/emergent-structure-evidence.json \
            --evidence artifacts/qccg/rg-bridge-evidence.json \
            --evidence artifacts/qccg/exact-rg-evidence.json \
            --evidence artifacts/qccg/feshbach-evidence.json \
            --evidence artifacts/qccg/cellulation-rg-evidence.json \
            --evidence artifacts/qccg/gr-cubic-ward-evidence.json \
            --evidence artifacts/qccg/tensor-cubic-evidence.json \
            --evidence artifacts/qccg/soft-graviton-evidence.json \
            --require QCCG_RG_BRIDGE_DATA_TOY

      - name: Assert stronger physical claims remain blocked
        run: |
          theorygate check qccg/theorygate.yaml \
            --evidence artifacts/qccg/evidence.json \
            --evidence artifacts/qccg/parent-evidence.json \
            --evidence artifacts/qccg/lorentz-evidence.json \
            --evidence artifacts/qccg/unitarity-evidence.json \
            --evidence artifacts/qccg/interacting-scaling-evidence.json \
            --evidence artifacts/qccg/graph-change-scaling-evidence.json \
            --evidence artifacts/qccg/constraint-evidence.json \
            --evidence artifacts/qccg/nonlinear-constraint-evidence.json \
            --evidence artifacts/qccg/cellulation-evidence.json \
            --evidence artifacts/qccg/manifold-diagnostic-evidence.json \
            --evidence artifacts/qccg/pachner-evidence.json \
            --evidence artifacts/qccg/cubic-evidence.json \
            --evidence artifacts/qccg/derivative-cubic-evidence.json \
            --evidence artifacts/qccg/structure-function-evidence.json \
            --evidence artifacts/qccg/emergent-structure-evidence.json \
            --evidence artifacts/qccg/rg-bridge-evidence.json \
            --evidence artifacts/qccg/exact-rg-evidence.json \
            --evidence artifacts/qccg/feshbach-evidence.json \
            --evidence artifacts/qccg/cellulation-rg-evidence.json \
            --evidence artifacts/qccg/gr-cubic-ward-evidence.json \
            --evidence artifacts/qccg/tensor-cubic-evidence.json \
            --evidence artifacts/qccg/soft-graviton-evidence.json \
            --json > artifacts/qccg/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/qccg/report.json").read_text())
          assert report["strongest_supported_claim"] in {
              "QCCG_RG_BRIDGE_DATA_TOY",
              "QCCG_EXACT_RG_ARCHITECTURE_TOY",
              "QCCG_CELLULATION_RG_ARCHITECTURE_TOY",
              "QCCG_EFFECTIVE_KERNEL_TOY",
              "QCCG_SELECTED_TENSOR_CUBIC_TOY",
          }, report["strongest_supported_claim"]
          assert report["claims"]["QCCG_EMERGENT_MASSLESS_SPIN2"]["supported"] is False
          assert report["obligations"]["UNIVERSAL_COUPLING_PHYSICAL"]["status"] == "BLOCKED"
          assert report["obligations"]["EXACT_FINITE_RG_BLOCKING_TOY"]["status"] == "PASS"
          assert report["obligations"]["SINGLE_COUPLING_RG_TRUNCATION_REJECTED"]["status"] == "PASS"
          assert report["obligations"]["FULL_FINITE_HARMONIC_RG_CLOSURE_TOY"]["status"] == "PASS"
          assert report["obligations"]["TRIVIAL_RG_FLOW_NEGATIVE_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["CELLULATION_FESHBACH_RG_TOY"]["status"] == "PASS"
          assert report["obligations"]["CELLULATION_RESTRICTED_RG_BASIS_REJECTED"]["status"] == "PASS"
          assert report["obligations"]["CELLULATION_FULL_OPERATOR_BASIS_CLOSURE_TOY"]["status"] == "PASS"
          assert report["obligations"]["CELLULATION_ENERGY_DEPENDENT_KERNEL"]["status"] == "PASS"
          assert report["obligations"]["QCCG_CELLULATION_NONPERTURBATIVE_RG"]["status"] == "OPEN"
          assert report["obligations"]["QCCG_NONPERTURBATIVE_RG_FLOW"]["status"] == "BLOCKED"
          assert any("QCCG_CELLULATION_NONPERTURBATIVE_RG=OPEN" in x for x in report["obligations"]["QCCG_NONPERTURBATIVE_RG_FLOW"]["blockers"])
          assert report["obligations"]["FESHBACH_COARSE_GRAINING_TOY"]["status"] == "PASS"
          assert report["obligations"]["COARSE_OPERATOR_PROLIFERATION_DETECTED"]["status"] == "PASS"
          assert report["obligations"]["ENERGY_DEPENDENT_EFFECTIVE_KERNEL_DETECTED"]["status"] == "PASS"
          assert report["obligations"]["QCCG_GRAPH_CHANGING_EFFECTIVE_KERNEL"]["status"] == "OPEN"
          assert report["obligations"]["AS_FIXED_POINT_MATCH"]["status"] == "BLOCKED"
          assert any("QCCG_NONPERTURBATIVE_RG_FLOW=OPEN" in x or "ESSENTIAL_CRITICAL_EXPONENT_MATCH=OPEN" in x for x in report["obligations"]["AS_FIXED_POINT_MATCH"]["blockers"])
          assert report["obligations"]["GR_CUBIC_WARD_KINEMATIC_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["GR_CUBIC_GAUGE_REPLACEMENT_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["QCCG_TENSOR_CUBIC_VERTEX_CONSTRUCTED"]["status"] == "PASS"
          assert report["obligations"]["QCCG_CUBIC_SELECTED_WARD_MATCH"]["status"] == "PASS"
          assert report["obligations"]["QCCG_FULL_CUBIC_WARD_MATCH"]["status"] == "OPEN"
          assert report["obligations"]["GR_CUBIC_VERTEX_MATCH"]["status"] == "BLOCKED"
          assert any("QCCG_FULL_CUBIC_WARD_MATCH=OPEN" in x for x in report["obligations"]["GR_CUBIC_VERTEX_MATCH"]["blockers"])
          assert report["obligations"]["DERIVATIVE_CUBIC_REPAIR"]["status"] == "PASS"
          assert report["obligations"]["MANIFOLD_DIAGNOSTIC_CALIBRATED"]["status"] == "PASS"
          assert report["obligations"]["MANIFOLD_DIMENSION_CONTROLS"]["status"] == "PASS"
          assert report["obligations"]["PACHNER_4D_MANIFOLD_TOPOLOGY_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["UNWEIGHTED_PACHNER_DIMENSION_FAILURE_DETECTED"]["status"] == "PASS"
          assert report["obligations"]["PACHNER_MOVESET_REPAIR_INSUFFICIENT"]["status"] == "PASS"
          assert report["obligations"]["QCCG_WEIGHTED_CRITICAL_CELLULATION_ENSEMBLE"]["status"] == "OPEN"
          assert report["obligations"]["QCCG_CELLULATION_GEOMETRY_MEASURED"]["status"] == "BLOCKED"
          assert any("QCCG_WEIGHTED_CRITICAL_CELLULATION_ENSEMBLE=OPEN" in x for x in report["obligations"]["QCCG_CELLULATION_GEOMETRY_MEASURED"]["blockers"])
          assert report["obligations"]["MANIFOLD_LIKENESS_SCALING"]["status"] == "BLOCKED"
          assert any("QCCG_CELLULATION_GEOMETRY_MEASURED=BLOCKED" in x for x in report["obligations"]["MANIFOLD_LIKENESS_SCALING"]["blockers"])
          assert report["obligations"]["CONTINUUM_MANIFOLD_PHASE"]["status"] == "BLOCKED"
          assert any("MANIFOLD_LIKENESS_SCALING=BLOCKED" in x for x in report["obligations"]["CONTINUUM_MANIFOLD_PHASE"]["blockers"])
          assert report["obligations"]["LORENTZ_UNIVERSALITY"]["status"] == "BLOCKED"
          assert any("MARGINAL_LV_STABILITY=OPEN" in x for x in report["obligations"]["LORENTZ_UNIVERSALITY"]["blockers"])
          assert report["obligations"]["INTERACTING_CODE_INTERTWINER_TOY"]["status"] == "PASS"
          assert report["obligations"]["SCALING_LEAKAGE_NEGATIVE_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["GRAPH_CHANGE_INTERTWINER_TOY"]["status"] == "PASS"
          assert report["obligations"]["GRAPH_CHANGE_LEAKAGE_NEGATIVE_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["QCCG_GRAPH_CHANGING_SCALING_MAP"]["status"] == "OPEN"
          assert report["obligations"]["INTERACTING_PHYSICAL_SCALING_UNITARITY"]["status"] == "BLOCKED"
          assert any("QCCG_GRAPH_CHANGING_SCALING_MAP=OPEN" in x for x in report["obligations"]["INTERACTING_PHYSICAL_SCALING_UNITARITY"]["blockers"])
          assert report["obligations"]["PHYSICAL_UNITARITY_SCALING_LIMIT"]["status"] == "BLOCKED"
          assert report["obligations"]["LOW_ENERGY_STRUCTURE_FUNCTION_CONVERGENCE"]["status"] == "PASS"
          assert report["obligations"]["STRUCTURE_FUNCTION_PATCH_CONTROL"]["status"] == "PASS"
          assert report["obligations"]["GR_HDA_STRUCTURE_FUNCTION_MATCH"]["status"] == "OPEN"
          assert report["obligations"]["NONLINEAR_CONSTRAINT_CLOSURE"]["status"] == "BLOCKED"
          assert any("GR_HDA_STRUCTURE_FUNCTION_MATCH=OPEN" in x for x in report["obligations"]["NONLINEAR_CONSTRAINT_CLOSURE"]["blockers"])
          assert report["obligations"]["CONTINUUM_DIFFEO_BRST"]["status"] == "BLOCKED"
          assert any("NONLINEAR_CONSTRAINT_CLOSURE=BLOCKED" in x for x in report["obligations"]["CONTINUUM_DIFFEO_BRST"]["blockers"])
          assert any("INTERACTING_PHYSICAL_SCALING_UNITARITY=BLOCKED" in x for x in report["obligations"]["PHYSICAL_UNITARITY_SCALING_LIMIT"]["blockers"])
          for cid in (
              "QCCG_EMERGENT_MASSLESS_SPIN2",
              "QCCG_RFQG_UNIVERSALITY",
              "QCCG_GR_IR",
              "QCCG_STRONG_GRAVITY",
          ):
              assert report["claims"][cid]["supported"] is False, cid
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: qccg-bridge-audit
          path: artifacts/qccg/
