name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: theorygate validate examples/astra_blackhole.json
      - run: theorygate check examples/astra_blackhole.json --require MODEL_INTERNAL_BRANCH_WEIGHT
      - run: theorygate check tests/fixtures/ingestion_model.json --evidence 'tests/fixtures/evidence/*.json' --require EXTERNAL_CLAIM
